
<!DOCTYPE html>
<html>
<head>
    <title>IP e Subnet Mask</title>
</head>
<body>

    <h2>Convertitore IP e Subnet Mask</h2>

    <p>
        Indirizzo IP:
        <input type="text" id="ip1" size="3"> .
        <input type="text" id="ip2" size="3"> .
        <input type="text" id="ip3" size="3"> .
        <input type="text" id="ip4" size="3">
    </p>

    <p>
        Numero di host:
        <input type="text" id="host" size="6">
    </p>

    <button onclick="converti()">Converti</button>

    <p id="risultato"></p>

    <script>
        function converti() {
            var ip = [
                Number(document.getElementById("ip1").value),
                Number(document.getElementById("ip2").value),
                Number(document.getElementById("ip3").value),
                Number(document.getElementById("ip4").value)
            ];

            var host = Number(document.getElementById("host").value);

            var suffix = 0;

            while (Math.pow(2, suffix) - 2 < host) {
                suffix++;
            }

            var prefix = 32 - suffix;

            var mask = [0, 0, 0, 0];
            var bit = prefix;

            for (var i = 0; i < 4; i++) {
                if (bit >= 8) {
                    mask[i] = 255;
                    bit = bit - 8;
                } else {
                    mask[i] = valoreMask(bit);
                    bit = 0;
                }
            }

            document.getElementById("risultato").innerHTML =
                "IP in binario:<br>" +
                binario(ip[0]) + "." + binario(ip[1]) + "." +
                binario(ip[2]) + "." + binario(ip[3]) +

                "<br><br>Subnet mask decimale:<br>" +
                mask[0] + "." + mask[1] + "." +
                mask[2] + "." + mask[3] +

                "<br><br>Subnet mask binaria:<br>" +
                binario(mask[0]) + "." + binario(mask[1]) + "." +
                binario(mask[2]) + "." + binario(mask[3]) +

                "<br><br>Numero di host richiesti: " + host +
                "<br>Prefix length: " + prefix +
                "<br>Suffix length: " + suffix +
                "<br>Host disponibili: " + (Math.pow(2, suffix) - 2);
        }

        function binario(numero) {
            let binario = "";

            for (let i = 0; i < 8; i++) {
                binario = (numero % 2) + binario;
                numero = Math.floor(numero / 2);
            }

            return binario;
        }

        function valoreMask(bit) {
            var valore = 0;

            for (var i = 0; i < bit; i++) {
                valore = valore + Math.pow(2, 7 - i);
            }

            return valore;
        }
    </script>

</body>
</html>
